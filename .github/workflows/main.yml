name: WhatsApp Bot Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # لتمكين التشغيل اليدوي من داخل GitHub
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter / Tests
        run: |
          npm test --if-present

  # ملاحظة: تشغيل البوت بشكل مستمر يستحسن أن يكون على VPS وليس داخل GitHub Actions
  # ولكن يمكنك استخدام هذا الجزء للتحقق من التشغيل أو الاستضافة الخارجيّة
