name: WhatsApp Bot Workflow

on:
  push:
    branches:
      - main
  # إعادة تشغيل البوت تلقائياً كل 6 ساعات
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Bot with Timeout
        # يتوقف البوت تلقائياً بعد 5 ساعات و 30 دقيقة ليسمح للجلسة التالية بالبدء
        run: timeout 5.5h npm start || true
